services:
  postgres:
    image: postgres:18
    container_name: combatforge_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: combatforge
      POSTGRES_USER: combatforge_user
      POSTGRES_PASSWORD: combatforge_password

    ports:
      - "5432:5432"

    volumes:
    - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: